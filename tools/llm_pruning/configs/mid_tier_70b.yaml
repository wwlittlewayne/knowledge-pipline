# Mid-tier 70B DENSE preset — target: 2x 3090 24GB NVLink + 2x EPYC 75F3 + 256GB
# Engine: llama.cpp (DEFAULT)
#
# 70B dense at Q4_K_M is ~40GB → fits 48GB VRAM TP=2 with KV cache room.
# Throughput: 25-45 tok/s single-user (no CPU offload needed; fully on GPU).
# Llama-3.3-70B / Qwen2.5-72B both work.

model_id: "meta-llama/Llama-3.3-70B-Instruct"
output_root: "./out/mid_tier_70b"
offload_folder: "/tmp/llmcompressor_offload"

engine: "llama_cpp"
arch_preset: "llama"

calib_dataset: "wikitext"
calib_subset: "wikitext-2-raw-v1"
calib_samples: 512
calib_seqlen: 2048

recover_samples: 60000
recover_datasets:
  - { name: "ise-uiuc/Magicoder-Evol-Instruct-110K", weight: 0.35 }
  - { name: "ise-uiuc/Magicoder-OSS-Instruct-75K",   weight: 0.10 }
  - { name: "garage-bAInd/Open-Platypus",            weight: 0.15 }
  - { name: "HuggingFaceH4/ultrachat_200k", split: "train_sft", weight: 0.20 }
  - { name: "Open-Orca/OpenOrca",                    weight: 0.10 }
  - { name: "shailja/Verilog_GitHub",                weight: 0.05 }
  # - { name: "./data/my_domain.jsonl",              weight: 0.05 }

lora_rank: 96
lora_alpha: 192
lora_target_modules: []
lora_epochs: 1
lora_lr: 1.0e-4
lora_batch: 1
lora_grad_accum: 16
lora_seqlen: 4096
use_qlora_base: true

moe: false
moe_ignore_router: true

llama_cpp_dir: "/opt/llama.cpp"
gguf_quant: "Q4_K_M"
